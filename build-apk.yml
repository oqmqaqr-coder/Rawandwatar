name:.github/workflows/build-apk.yml

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png chorus.otf www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "R.W" com.rawandwatar.app --web-dir=www
          npx cap add android

      - name: Launcher icons
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os, shutil
          src = Image.open('icon-512.png').convert('RGB')
          res = 'android/app/src/main/res'
          for d, n in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              p = res + '/mipmap-' + d
              os.makedirs(p, exist_ok=True)
              im = src.resize((n, n), Image.LANCZOS)
              im.save(p + '/ic_launcher.png')
              m = Image.new('L', (n, n), 0)
              ImageDraw.Draw(m).ellipse([0, 0, n - 1, n - 1], fill=255)
              r = Image.new('RGBA', (n, n), (0, 0, 0, 0))
              r.paste(im, (0, 0), m)
              r.save(p + '/ic_launcher_round.png')
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          PY

      - name: Fixed signing key
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RW-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
